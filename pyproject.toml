[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-rag"
version = "0.1.0"
description = "Production-Grade Agentic RAG Knowledge Copilot"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # Async HTTP
    "httpx==0.27.2",
    "aiofiles==24.1.0",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Vector DB
    "qdrant-client==1.12.1",

    # Cache
    "redis[hiredis]==5.2.0",

    # AI / LLM clients
    "anthropic==0.40.0",
    "groq==0.12.0",
    "langchain-core==0.3.21",
    "langgraph==0.2.55",

    # Embeddings + reranker (local)
    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "FlagEmbedding==1.3.3",

    # BM25
    "rank-bm25==0.2.2",

    # Document parsing
    "docling==2.14.0",

    # Chunking
    "langchain-text-splitters==0.3.2",

    # Observability
    "langfuse==2.55.0",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-exporter-otlp==1.28.2",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # Utilities
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
eval = [
    "ragas==0.2.6",
    "deepeval==1.4.7",
    "datasets==3.1.0",
    "pandas==2.2.3",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
